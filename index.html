<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="VehicleVault is an offline-first vehicle maintenance tracker." />
  <title>VehicleVault</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <noscript>VehicleVault requires JavaScript.</noscript>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">VV</div>
        <div>
          <h1>VehicleVault</h1>
          <p>Maintenance tracker</p>
        </div>
      </div>

      <label class="field-label" for="vehicleSelect">Active vehicle</label>
      <select id="vehicleSelect" class="input"></select>

      <nav class="nav" aria-label="Primary navigation">
        <button class="nav-btn active" data-view="dashboard">Dashboard</button>
        <button class="nav-btn" data-view="vehicles">Vehicles</button>
        <button class="nav-btn" data-view="maintenance">Maintenance</button>
        <button class="nav-btn" data-view="reminders">Reminders</button>
        <button class="nav-btn" data-view="expenses">Expenses</button>
        <button class="nav-btn" data-view="documents">Documents</button>
        <button class="nav-btn" data-view="export">Export</button>
        <button class="nav-btn" data-view="sync">GitHub Sync</button>
      </nav>

      <div class="sidebar-note">
        <strong>Local-first:</strong> data saves to this browser. Use export or GitHub sync for backup.
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">Offline-first vehicle records</p>
          <h2 id="viewTitle">Dashboard</h2>
        </div>
        <div class="status-pills">
          <span id="updatedPill" class="pill">Updated: never</span>
          <span id="syncPill" class="pill">Local only</span>
        </div>
      </header>

      <section id="viewRoot" class="view-root"></section>
    </main>
  </div>

  <template id="emptyTemplate">
    <div class="empty-state">No records yet.</div>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
